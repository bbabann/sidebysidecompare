<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22263a">
  <title>Galaxy Specs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Galaxy Specs">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div class="fx" id="fx"></div>

    <button class="close" id="close" type="button" aria-label="Back to guide" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <!-- Guide: swipe through the steps, then start -->
    <section class="screen screen--guide" id="guide" hidden>
      <h1 class="guide-title">Compare<br>S26 Series</h1>
      <div class="guide-track" id="guideTrack">
        <div class="guide-slide">
          <div class="guide-art">
            <div class="guide-frame">
              <img src="assets/guide-phone.png" alt="">
              <img class="guide-glow" src="assets/guide-glow.svg" alt="">
            </div>
          </div>
          <p class="guide-caption">Tap to see each spec,<br>one by one.</p>
        </div>
        <div class="guide-slide">
          <div class="guide-art">
            <div class="guide-frame">
              <img src="assets/guide-hands.png" alt="">
            </div>
          </div>
          <p class="guide-caption">Place two phones<br>side by side to compare.</p>
        </div>
      </div>
      <div class="guide-dots" id="guideDots" role="tablist" aria-label="Guide steps">
        <button type="button" class="is-active" role="tab" aria-label="Step 1" aria-selected="true"></button>
        <button type="button" role="tab" aria-label="Step 2" aria-selected="false"></button>
      </div>
      <button class="btn-start" id="startCompare" type="button">Start Compare</button>
    </section>

    <!-- Spec -->
    <section class="screen screen--spec" id="spec" hidden>
      <p class="progress" id="progress"></p>
      <!-- Same text twice: the overlay copy is clipped to where the visual sits,
           so text flips between dark and white exactly at the visual's edge. -->
      <div class="ink" id="inkBase">
        <p class="eyebrow js-device"></p>
        <h2 class="label js-label"></h2>
        <p class="value"><span class="js-value"></span><span class="unit js-unit"></span></p>
      </div>
      <div class="ink" id="inkOverlay" aria-hidden="true">
        <p class="eyebrow js-device"></p>
        <h2 class="label js-label"></h2>
        <p class="value"><span class="js-value"></span><span class="unit js-unit"></span></p>
      </div>
    </section>

    <!-- End -->
    <section class="screen" id="end" hidden>
      <div class="orb" aria-hidden="true"></div>
      <h2 class="label">That's all</h2>
      <span class="pill">Tap to restart <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#fff" fill-opacity="0.9"/><path d="M10 7.5 14.5 12 10 16.5" fill="none" stroke="#161a26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </section>

    <!-- Fallback picker -->
    <section class="screen" id="picker" hidden>
      <p class="subtitle">Device not detected</p>
      <h2 class="label">Which device is this?</h2>
      <div class="choices" id="choices"></div>
    </section>
  </main>

  <script src="specs.js"></script>
  <script src="script.js"></script>
</body>
</html>
