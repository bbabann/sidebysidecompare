<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7e9f0">
  <title>Galaxy Specs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div class="fx" id="fx"></div>

    <!-- Start -->
    <section class="screen" id="start" hidden>
      <div class="orb" aria-hidden="true"></div>
      <p class="eyebrow">This device</p>
      <h1 class="device" id="deviceName"></h1>
      <p class="hint">Tap to start</p>
    </section>

    <!-- Spec -->
    <section class="screen screen--spec" id="spec" hidden>
      <p class="progress" id="progress"></p>
      <!-- Same text twice: the overlay copy is clipped to where the visual sits,
           so text flips between dark and white exactly at the visual's edge. -->
      <div class="ink" id="inkBase">
        <p class="eyebrow js-device"></p>
        <h2 class="label js-label"></h2>
        <p class="value"><span class="js-value"></span><span class="unit js-unit"></span></p>
      </div>
      <div class="ink" id="inkOverlay" aria-hidden="true">
        <p class="eyebrow js-device"></p>
        <h2 class="label js-label"></h2>
        <p class="value"><span class="js-value"></span><span class="unit js-unit"></span></p>
      </div>
    </section>

    <!-- End -->
    <section class="screen" id="end" hidden>
      <div class="orb" aria-hidden="true"></div>
      <h2 class="label">That's all</h2>
      <p class="hint">Tap to restart</p>
    </section>

    <!-- Fallback picker -->
    <section class="screen" id="picker" hidden>
      <p class="eyebrow">Device not detected</p>
      <h2 class="label">Which device is this?</h2>
      <div class="choices" id="choices"></div>
    </section>
  </main>

  <script src="specs.js"></script>
  <script src="script.js"></script>
</body>
</html>
